[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodvision"
version = "0.1.0"
description = "Indian food image classifier with an MLOps pipeline (training, tracking, API, Docker, CI)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ankit Parate" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foodvision = ["nutrition.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
